# The Cloudflare Worker in front of the web app's static files (triya/docs/cloudflare.md).
# Its own workspace: it builds only for Cloudflare (worker-build), not with `cargo xtask ci`.
[package]
name = "triya-cloudflare"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8.7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[workspace]
