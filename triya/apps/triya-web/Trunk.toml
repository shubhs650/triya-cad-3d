# Triya CAD 3D. Build with: trunk build --release   (from triya/apps/triya-web)
[build]
target = "index.html"
dist = "../../../dist/triya-web"
public_url = "./"
filehash = true

[serve]
addresses = ["127.0.0.1"]
port = 8782

# Offline use and updates: release builds get sw.js listing this build's files (xtask/src/web_offline.rs).
[[hooks]]
stage = "post_build"
command = "cargo"
command_arguments = ["xtask", "web-offline"]
