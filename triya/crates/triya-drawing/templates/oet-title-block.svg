<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="56mm" viewBox="0 0 180 56">
  <!-- Triya CAD 3D: the Open Engineering Tools default title block (original work, MIT OR Apache-2.0).
       Units are sheet mm, y down from the block's top-left corner. Placeholders: {{org}} {{project}}
       {{title}} {{drawing_no}} {{rev}} {{size}} {{drawn_by}} {{checked_by}} {{date}} {{scale}} {{sheet}}. -->
  <rect x="0" y="0" width="180" height="56"/>
  <line x1="0" y1="12" x2="180" y2="12"/>
  <line x1="0" y1="28" x2="180" y2="28"/>
  <line x1="0" y1="40" x2="180" y2="40"/>
  <line x1="110" y1="0" x2="110" y2="12"/>
  <line x1="120" y1="28" x2="120" y2="40"/>
  <line x1="145" y1="28" x2="145" y2="40"/>
  <line x1="36" y1="40" x2="36" y2="56"/>
  <line x1="72" y1="40" x2="72" y2="56"/>
  <line x1="108" y1="40" x2="108" y2="56"/>
  <line x1="144" y1="40" x2="144" y2="56"/>
  <text x="3" y="8.5" font-size="5">{{org}}</text>
  <text x="112" y="3.5" font-size="2">PROJECT</text>
  <text x="112" y="9.5" font-size="3">{{project}}</text>
  <text x="3" y="15.5" font-size="2">TITLE</text>
  <text x="3" y="24" font-size="5">{{title}}</text>
  <text x="3" y="31.5" font-size="2">DRAWING NO.</text>
  <text x="3" y="37.5" font-size="3.5">{{drawing_no}}</text>
  <text x="122" y="31.5" font-size="2">REV</text>
  <text x="122" y="37.5" font-size="3.5">{{rev}}</text>
  <text x="147" y="31.5" font-size="2">SIZE</text>
  <text x="147" y="37.5" font-size="3.5">{{size}}</text>
  <text x="2" y="43.5" font-size="2">DRAWN</text>
  <text x="2" y="52" font-size="3">{{drawn_by}}</text>
  <text x="38" y="43.5" font-size="2">CHECKED</text>
  <text x="38" y="52" font-size="3">{{checked_by}}</text>
  <text x="74" y="43.5" font-size="2">DATE</text>
  <text x="74" y="52" font-size="3">{{date}}</text>
  <text x="110" y="43.5" font-size="2">SCALE</text>
  <text x="110" y="52" font-size="3">{{scale}}</text>
  <text x="146" y="43.5" font-size="2">SHEET</text>
  <text x="146" y="52" font-size="3">{{sheet}}</text>
</svg>
