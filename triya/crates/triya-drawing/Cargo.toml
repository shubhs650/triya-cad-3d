[package]
name = "triya-drawing"
description = "Triya CAD 3D 2D drawing model (sheets, views, edges, dimensions, tables) and plotters (SVG); no UI toolkit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The vessel model only (`triya_vessel::model`, `triya_vessel::eval`): drawing views of a vessel.
triya-vessel = { workspace = true }
triya-stdlib = { workspace = true }
triya-brand = { workspace = true }
# Commands (`drawing.*`), the DXF writer and its point type.
solidcraft-engine = { workspace = true }
solidcraft-io = { workspace = true }
solidcraft-geom = { workspace = true }
