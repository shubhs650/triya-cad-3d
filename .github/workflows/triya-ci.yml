# SPDX-License-Identifier: MIT OR Apache-2.0
# Triya CAD 3D — fork-specific gates. Upstream's CI workflow still runs (it tests the whole
# workspace, Triya crates included); this one adds the overlay rules and the web shell.
name: Triya CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: triya-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TRUNK_VERSION: v0.21.14

jobs:
  seams:
    name: Seam whitelist + licence headers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fetch upstream baseline tag
        run: |
          git remote add upstream https://github.com/tangency-labs/solidcraft.git || true
          git fetch upstream --tags --quiet
      - name: Whitelist check against the upstream base
        run: bash triya/ci/check-patch-whitelist.sh v0.25.1
      - name: Seam patches match the tree
        run: bash triya/ci/refresh-seam-patches.sh --check v0.25.1
      - name: SPDX headers on Triya files (Rust, TOML, shell, JS, HTML, Triya workflows)
        run: |
          missing=$(grep -rL "SPDX-License-Identifier: MIT OR Apache-2.0" --include='*.rs' --include='*.toml' --include='*.sh' --include='*.js' --include='*.html' --include='*.yml' triya/ .github/workflows/triya-*.yml .github/workflows/upstream-sync.yml || true)
          if [ -n "$missing" ]; then echo "Missing SPDX header:"; echo "$missing"; exit 1; fi
      - name: No illustrative table rows outside tests
        # The kickoff skeleton ships placeholder rows; T3.1 replaces them and deletes the marker file.
        run: |
          hits=$(grep -rli 'illustrative' triya/crates/*/data 2>/dev/null || true)
          if [ -n "$hits" ]; then
            if [ -f triya/crates/triya-stdlib/data/.illustrative-allowed-until-T3.1 ]; then
              echo "::warning::illustrative placeholder tables present (allowed until PLAN T3.1): $hits"
            else
              echo "::error::illustrative rows must not ship: $hits"; exit 1
            fi
          fi

  triya-crates:
    name: Triya crates (clippy + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: triya }
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (Triya crates)
        run: cargo clippy -p triya-brand -p triya-stdlib -p triya-vessel -p triya-drawing -p triya-ui -p triya-cli -p triya --all-targets -- -D warnings
      - name: tests (Triya crates)
        run: cargo test -p triya-brand -p triya-stdlib -p triya-vessel -p triya-drawing -p triya-ui -p triya-cli
      - name: Example cylinder to STEP (size and measured volume, PLAN T0.5)
        run: |
          cargo run -q -p triya-cli -- run triya/crates/triya-vessel/examples/cylinder.json --out "$RUNNER_TEMP/cyl.step"
          ls -la "$RUNNER_TEMP/cyl.step"
          cargo run -q -p triya-cli -- eval triya/crates/triya-vessel/examples/cylinder.json
      - name: Phase 2 exit vessel to STEP (skirt, 2:1 head, two courses, cone, F&D head)
        run: |
          cargo run -q -p triya-cli -- run triya/crates/triya-vessel/examples/vessel-a-shell.json --out "$RUNNER_TEMP/vessel-a.step"
          test -s "$RUNNER_TEMP/vessel-a.step" && ls -la "$RUNNER_TEMP/vessel-a.step"
      - name: layers + assets (upstream xtask)
        run: cargo xtask layers && cargo xtask assets
      - name: wasm check (Triya crates)
        run: cargo check --target wasm32-unknown-unknown -p triya-vessel -p triya-drawing -p triya-ui -p triya-stdlib

  phase3-exit:
    name: Phase 3 exit (vessel A's six nozzles)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: triya }
      - name: vessel A regenerates with every nozzle built or degraded gracefully
        run: cargo test -p triya-vessel --test phase3_exit -- --ignored --nocapture

  phase4-exit:
    name: Phase 4 exit (vessels B and C whole, BOM)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: triya }
      - name: vessels B and C build every attachment and weigh within 2 % of the handbook
        run: cargo test -p triya-vessel --test phase4_exit -- --ignored --nocapture

  upstream-roundtrip:
    name: Opens in unmodified upstream v0.25.1 (ADR-0006)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upstream baseline tag
        run: |
          git remote add upstream https://github.com/tangency-labs/solidcraft.git || true
          git fetch upstream --tags --quiet
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: triya }
      - name: a regenerated vessel saved by Triya opens in upstream's CLI with the same bodies
        run: bash triya/ci/upstream-roundtrip.sh

  upstream-gates:
    # Since v0.22 upstream's own CI runs on Blacksmith runners, which this fork does not have, so
    # its jobs sit queued here. This job runs the upstream gates our seams can break on GitHub's
    # standard runners: the repository checks, workspace clippy, and the tests of the crates the
    # seams touch (ribbon, product name, command registry, layers, web offline template).
    name: Upstream gates (repository checks, clippy, seam crates' tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SOLIDCRAFT_GPU: software
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'clippy, rustfmt' }
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: triya-upstream-gates }
      - name: Install a software Vulkan driver (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - name: Repository checks (format, assets, layers, lists, UI containers, licences)
        run: |
          cargo fmt --all -- --check
          cargo xtask assets
          cargo xtask layers
          cargo xtask lists
          cargo xtask ui-containers
          cargo xtask licences --check
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets --profile ci --locked -- -D warnings
      - name: Tests of the crates with seams
        run: |
          # The ci profile, as upstream: egui's debug assertions trip in headless UI tests otherwise.
          # Scoped to the modules our seams touch (ribbon, catalogs, Home, Help, app bar). The
          # render_workspace tests are upstream renderer tests our seams don't reach, and one of them
          # exhausts a standard runner's memory under the software GPU.
          cargo test --locked --profile ci -p solidcraft-ui-egui --lib -- --test-threads=2 \
            workspace:: i18n:: home:: help:: toolbar:: --skip render_workspace::
          cargo test --locked -p xtask

  web-shell:
    name: Triya web shell (trunk build + offline test)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [seams]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: triya-web }
      - name: Install trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build
        working-directory: triya/apps/triya-web
        run: trunk build --release
      - name: Offline/update test (headless Chrome)
        # The test regenerates sw.js to compare it with the build's; outside Trunk's hook it needs to
        # be told which template the build used (xtask/src/web_offline.rs seam, PATCHES.md row 12).
        env: { TRUNK_SOURCE_DIR: '${{ github.workspace }}/triya/apps/triya-web' }
        run: cargo xtask web-offline-test --site dist/triya-web
      - name: Record wasm size (raw, gzip -9, brotli -q 11; Cloudflare's per-file limit is 25 MiB)
        run: |
          ls -la dist/triya-web/*.wasm
          du -sh dist/triya-web
          sudo apt-get install -y --no-install-recommends brotli >/dev/null
          for w in dist/triya-web/*.wasm; do
            gz=$(gzip -9 -n -c "$w" | wc -c); br=$(brotli -q 11 -c "$w" | wc -c)
            echo "$w: gzip $gz B, brotli $br B"
            if [ "$gz" -gt 26214400 ]; then echo "::warning::gzipped wasm is over Cloudflare's 25 MiB file limit ($gz B; brotli $br B)"; fi
          done
      - uses: actions/upload-artifact@v4
        with: { name: triya-web-dist, path: dist/triya-web, retention-days: 7 }
